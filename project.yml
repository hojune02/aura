name: aura
options:
  bundleIdPrefix: com.hojunekim
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: X97AN335RA
packages: {}
targets:
  aura:
    type: application
    platform: iOS
    sources:
      - path: aura
        excludes:
          - AppStore
    resources:
      - path: aura.storekit
    info:
      path: aura/Info.plist
      properties:
        CFBundleDisplayName: aura
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.hojunekim.aura
            CFBundleURLSchemes:
              - aura
    settings:
      base:
        PRODUCT_NAME: aura
        PRODUCT_BUNDLE_IDENTIFIER: com.hojunekim.aura
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
  auraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: aura
schemes:
  aura:
    build:
      targets:
        aura: all
        auraTests: [test]
    run:
      config: Debug
      storeKitConfiguration: aura.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - auraTests
